name: Update VTSU Mesonet Data

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch latest weather data
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
        run: |
          python << 'EOF'
          import json
          import requests
          from datetime import datetime
          import os
          
          TOKEN = os.environ.get('SYNOPTIC_TOKEN', 'a5d9d976cd324d9e9b2c61fbc55b8b61')
          STID = 'LSC01'
          API_URL = f'https://api.synopticdata.com/v2/stations/latest?stid={STID}&token={TOKEN}&units=english'
          
          try:
              print(f"Fetching weather data for station {STID}...")
              response = requests.get(API_URL, timeout=10)
              response.raise_for_status()
              
              data = response.json()
              
              # Check for API error response
              if data.get('SUMMARY', {}).get('RESPONSE_CODE') != 1:
                  raise Exception(data.get('SUMMARY', {}).get('RESPONSE_MESSAGE', 'API error'))
              
              # Prepare data for storage
              station_data = {
                  'timestamp': datetime.utcnow().isoformat() + 'Z',
                  'status': 'success',
                  'data': data
              }
              
              # Save to JSON file
              with open('mesonet-data.json', 'w') as f:
                  json.dump(station_data, f, indent=2)
              
              print("Weather data updated successfully!")
              print(json.dumps(station_data, indent=2))
              
          except Exception as e:
              print(f"Error fetching weather data: {e}")
              # Save error state
              error_data = {
                  'timestamp': datetime.utcnow().isoformat() + 'Z',
                  'status': 'error',
                  'error': str(e),
                  'message': 'Failed to fetch latest data'
              }
              with open('mesonet-data.json', 'w') as f:
                  json.dump(error_data, f, indent=2)
              exit(1)
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mesonet-data.json
          git diff-index --quiet HEAD || git commit -m "Update mesonet data - $(date -u +'%Y-%m-%d %H:%M:%S Z')"
          git push
